<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Web Short</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<link rel="stylesheet" href="styles.css">

<script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
</script>
</head>
<body class="has-background-light has-min-height-100vh is-flex is-align-items-center position-relative">

<!-- Botón de Toggle Theme Flotante -->
<div class="auth-theme-toggle">
    <button id="themeToggle" class="button is-ghost is-small has-text-grey" title="Cambiar tema">
        <svg class="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="theme-icon-dark is-hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
</div>

<section class="section is-fullwidth">
<div class="container auth-container has-text-centered">

<div class="mb-5">
<a href="index.html" class="title is-3 custom-logo is-flex is-justify-content-center is-align-items-center">
<svg class="mr-2" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#485fc7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
Web Short
</a>
<h1 class="title is-4 mt-4 has-text-dark" data-i18n="register_title">Bienvenido a Web Short</h1>
<p class="subtitle is-6 has-text-grey" data-i18n="register_subtitle">Regístrate para empezar a crear clips</p>
</div>

<form>
<div class="field">
<div class="control">
<input class="input auth-input" type="email" placeholder="Correo electrónico" data-i18n-placeholder="email_placeholder" required>
</div>
</div>
<div class="field mt-4">
<div class="control">
<input class="input auth-input" type="password" placeholder="Contraseña" data-i18n-placeholder="password_placeholder" required>
</div>
</div>
<div class="field mt-4 mb-5">
<div class="control">
<input class="input auth-input" type="password" placeholder="Confirmar contraseña" data-i18n-placeholder="confirm_password_placeholder" required>
</div>
</div>

<button class="button is-link is-fullwidth auth-submit-btn" type="submit" data-i18n="register_submit">Crear cuenta</button>
</form>

<div class="mt-5 is-size-7">
<p class="has-text-grey">
<span data-i18n="register_has_account">¿Ya tienes una cuenta?</span> 
<a href="login.html" class="has-text-link" data-i18n="register_sign_in">Iniciar sesión</a>
</p>
<p class="mt-3">
<a href="index.html" class="has-text-grey" data-i18n="back_home">Volver al inicio</a>
</p>
</div>

</div>
</section>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Web Short</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="has-background-light has-min-height-100vh is-flex is-align-items-center">

<section class="section is-fullwidth">
<div class="container auth-container has-text-centered">

<div class="mb-5">
<a href="index.html" class="title is-3 custom-logo is-flex is-justify-content-center is-align-items-center">
<svg class="mr-2" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#485fc7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
Web Short
</a>
<h1 class="title is-4 mt-4 has-text-dark" data-i18n="register_title">Bienvenido a Web Short</h1>
<p class="subtitle is-6 has-text-grey" data-i18n="register_subtitle">Regístrate para empezar a crear clips</p>
</div>

<button class="button is-white is-fullwidth has-shadow mb-4 auth-google-btn">
<svg class="mr-2" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
<span data-i18n="register_google">Continuar con Google</span>
</button>

<div class="auth-divider">
<span data-i18n="login_divider">o continuar con correo electrónico</span>
</div>

<form>
<div class="field">
<div class="control">
<input class="input auth-input" type="email" placeholder="Correo electrónico" data-i18n-placeholder="email_placeholder" required>
</div>
</div>
<div class="field mt-4">
<div class="control">
<input class="input auth-input" type="password" placeholder="Contraseña" data-i18n-placeholder="password_placeholder" required>
</div>
</div>
<div class="field mt-4 mb-5">
<div class="control">
<input class="input auth-input" type="password" placeholder="Confirmar contraseña" data-i18n-placeholder="confirm_password_placeholder" required>
</div>
</div>

<button class="button is-link is-fullwidth auth-submit-btn" type="submit" data-i18n="register_submit">Crear cuenta</button>
</form>

<div class="mt-5 is-size-7">
<p class="has-text-grey">
<span data-i18n="register_has_account">¿Ya tienes una cuenta?</span> 
<a href="login.html" class="has-text-link" data-i18n="register_sign_in">Iniciar sesión</a>
</p>
<p class="mt-3">
<a href="index.html" class="has-text-grey" data-i18n="back_home">Volver al inicio</a>
</p>
</div>

</div>
</section>

</body>
</html>
